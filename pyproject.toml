[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-world-model-eval"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.4.6", "pandas==3.1.1", "PyYAML==6.0.3", "gymnasium==1.4.0", "torch==2.8.0"]

[project.optional-dependencies]
agent = ["langgraph==0.6.11", "langgraph-checkpoint-sqlite==3.1.3"]
local-agent = ["transformers==4.57.3", "accelerate==1.12.0"]

[tool.setuptools.packages.find]
include = ["agents*", "benchmark*", "controllers*", "evaluators*", "metrics*", "models*", "simulators*"]
