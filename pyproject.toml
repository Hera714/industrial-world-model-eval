[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-world-model-eval"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.4.6", "pandas==3.1.1", "PyYAML==6.0.3", "gymnasium==1.4.0", "torch==2.8.0"]

[tool.setuptools.packages.find]
include = ["benchmark*", "controllers*", "evaluators*", "metrics*", "models*", "simulators*"]
