    comfort: 1.0
    energy: 1.0
  prediction:
  - mae
  - rmse
  - valid_fraction
  - physical_warning_fraction
  units:
    comfort_integral: degC*h
    energy: kWh
    power: kW
    temperature: degC
    time: s
  validity:
    absolute_divergence: 1000.0
    interval_energy_kwh:
