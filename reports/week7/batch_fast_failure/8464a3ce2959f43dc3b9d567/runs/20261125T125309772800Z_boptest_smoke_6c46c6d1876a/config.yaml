  prediction_modes:
  - teacher_forcing
  - free_running
  tasks:
  - closed_loop
failure_policy:
  advance_failure: stop_episode_no_retry
  invalid_prediction: stop_rollout_keep_prefix
  planning_failure: release_to_embedded
  retries:
    advance_requests: 0
    read_requests: 0
  timeouts:
