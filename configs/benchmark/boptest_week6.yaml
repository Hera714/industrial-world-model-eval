      closed_loop: start_day
evaluator:
  tasks:
  - open_loop
  - closed_loop
  - robustness
  - policy_ranking
  prediction_modes:
  - teacher_forcing
  - free_running
  origin_stride_steps: 4
  fault_conditions:
  - clean
  - noise_0p1
  - noise_0p3
  - missing_1
  - missing_4
  - goal_plus1
  baseline: embedded
  condition_matrix:
    open_loop:
      episodes: *id001
      conditions:
      - clean
      - noise_0p1
      - noise_0p3
      - missing_1
      - missing_4
    closed_loop:
      episodes: *id001
      conditions:
      - clean
    robustness:
      episodes:
      - id_test_day160
      - id_test_day292
      - id_test_day340
      conditions:
      - noise_0p3
      - missing_4
      - goal_plus1
    policy_ranking:
      episodes: *id001
      conditions:
      - clean
  faults:
    noise_0p1:
      kind: temperature_noise
      std_degC: 0.1
      channels:
      - zone_c
      - supply_c
      - return_c
    noise_0p3:
      kind: temperature_noise
      std_degC: 0.3
      channels:
      - zone_c
      - supply_c
      - return_c
    missing_1:
      kind: sensor_missing
      channel: supply_c
      burst_steps: 1
      repeat_period_steps: 24
      fill: last_valid
    missing_4:
      kind: sensor_missing
      channel: supply_c
      burst_steps: 4
      repeat_period_steps: 24
      fill: last_valid
    goal_plus1:
      kind: comfort_shift
      shift_degC: 1.0
horizon:
  prediction_steps:
  - 1
  - 5
  - 10
  - 20
  mpc_steps: 12
  candidates: 256
  action_hold_steps: 4
metrics:
  prediction:
  - mae
  - rmse
  - valid_fraction
  - physical_warning_fraction
  control:
  - cost
  - energy_kwh
  - comfort_degree_hours
  - comfort_violation_rate
  - center_tracking_mae_c
  - decision_mean_ms
  - decision_p95_ms
  - fallback_count
  units:
    temperature: degC
    power: kW
    energy: kWh
    time: s
    comfort_integral: degC*h
  cost_weights:
    comfort: 1.0
    energy: 1.0
    action_change: 0.02
  validity:
    zone_degC:
    - 0.0
    - 50.0
    water_degC:
    - 0.0
    - 90.0
    interval_energy_kwh:
    - 0.0
    - 10.0
    absolute_divergence: 1000.0
    nonfinite: stop_keep_prefix
  aggregation: episode_then_fixed_training_seeds
output:
  directory: reports/runs
  run_name: boptest_week6
  formats:
    trajectory: csv
    prediction: npz
    metrics: json
    events: jsonl
    report: md
  existing_run: new_unique_run
failure_policy:
  invalid_prediction: stop_rollout_keep_prefix
  planning_failure: release_to_embedded
  advance_failure: stop_episode_no_retry
  retries:
    read_requests: 2
    advance_requests: 0
  timeouts:
    http_seconds: 180.0
    planning_seconds: 5.0
