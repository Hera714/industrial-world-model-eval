# 总说明：针对固定 smoke 配置的宽松异常检测，不作为模型优劣结论。
required_files: [config.yaml, versions.json, input_hashes.json, metrics.json, trajectories.csv, events.jsonl, run.log, status.json, predictions.npz, report.md, artifacts.json]
models: [persistence, arx]
controllers: [persistence, arx, embedded]
episode_id: id_test_day160
modes: [teacher_forcing, free_running]
horizons: [1, 4]
variables: [zone_c, supply_c, return_c, floor_heat_kw, electric_kw, interval_energy_kwh]
units: [degC, degC, degC, kW, kW, kWh]
requested_origins: 5
scored_steps: 8
min_valid_fraction: 1.0
max_zone_error_c: 10.0
max_elapsed_seconds: 1800
control_max:
  cost: 200.0
  energy_kwh: 50.0
  comfort_violation_rate: 1.0
  comfort_degree_hours: 40.0
  center_tracking_mae_c: 20.0
  decision_mean_ms: 30000.0
  decision_p95_ms: 30000.0
  fallback_count: 0
