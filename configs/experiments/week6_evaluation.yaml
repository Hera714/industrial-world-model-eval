baseline: embedded controller, engineering reference with internal sensors
information_sets:
  main: Current and historical public observations; future weather held at origin;
    known calendar/comfort schedule
  ideal_reference: API perfect weather forecast, separately labelled
  history_steps: 16
  history_token: observation before action, applied/current candidate action, weather/calendar
  teacher_forcing: May observe next actual observation at each step
  free_running: Own predicted observations only after origin
horizons:
- 1
- 5
- 10
- 20
sampling:
  origin_stride_steps: 4
  common_max_horizon: 20
  control_step_seconds: 900
  scored_episode_steps: 192
  context_steps: 96
  warmup_seconds: 604800
seeds:
  training:
  - 42
  - 43
  - 44
  observation_fault: 64042
  open_fault_rng: default_rng(64042 + origin source_step)
  closed_fault_rng: default_rng(64042 + start_day)
  candidate_rng: default_rng(604200 + episode step), identical for all models
  simulator: Calendar/warmup deterministic; client reset seed does not create independent
    physical weather
control_budget:
  horizon: 12
  candidates: 256
  action_hold_steps: 4
  seeds:
  - 42
  - 43
  - 44
  time_budget_s: 5.0
  comfort_weight: 1.0
  energy_weight: 1.0
  action_change_weight: 0.02
  planning_seed: 42
action:
  point: oveTSet_u
  activation: oveTSet_activate
  unit: K
  experiment_bounds_c:
  - 18.0
  - 24.0
  fallback: release_to_embedded
robustness:
  noise_std_c:
  - 0.0
  - 0.1
  - 0.3
  missing_burst_steps:
  - 0
  - 1
  - 4
  missing_sensor: supply_c
  fill: last_valid
  seed: 64042
goal_shift:
  condition: goal_plus1
  comfort_bound_shift_c: 1.0
  physical_weather: identical to reference
  model_retrained: false
score:
  formula: outside_comfort_deviation^2 * 0.25h + step_energy_kwh + 0.02*(action_C-previous_action_C)^2
  comfort_bounds: Independent published schedule; goal_plus1 adds 1C to both bounds
  energy: native ener_tot delta times area192m2
  terminal_cost: 0.0
  fallback: Release override to embedded; all costs retained
  time_budget_check: Between batch predictions and at plan end; not preemptive
validity:
  nonfinite: Stop, retain prefix, later predictions invalid
  divergence: 'Any absolute output above1000: stop'
  open_physical_warning: zone outside0..50C; water outside0..90C; negative power/energy;
    preserve original output
  mpc_filter: finite; zone0..50C; interval energy0..10kWh; no valid candidates ->
    fallback
aggregation:
  order: window metrics within episode, then training-seed/date summaries as labelled
  independent_unit: calendar block, not timestep or overlapping window
  bootstrap_repeats: 2000
  comparison: Same date/history/budget across models; different-weather dates are
    distribution contrasts, not same-weather interventions
  excluded_from_primary_reference:
  - id_test_day172
  primary_reference_episodes:
  - id_test_day160
  - id_test_day292
  - id_test_day340
expected:
  data_blocks: 18
  checkpoints: 8
  clean_controls: 72
  fault_controls: 54
  goal_controls: 27
  total_controls: 153
